<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RM WARZONE</title>

<style>

*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;

  font-family:Arial,sans-serif;

  background:
    radial-gradient(circle at center,#241111,#050505 70%);
}

/* GAME */

#game{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;

  background:
    linear-gradient(
      rgba(0,0,0,.15),
      rgba(0,0,0,.45)
    );
}

/* TOP HUD */

#topHud{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  pointer-events:none;
}

/* PLAYER BOX */

#playerBox{
  width:260px;

  padding:12px;

  background:rgba(0,0,0,.65);

  border:1px solid rgba(255,60,60,.4);

  border-radius:14px;

  backdrop-filter:blur(10px);

  box-shadow:
    0 0 20px rgba(255,0,0,.2);
}

#playerName{
  color:white;
  font-weight:bold;
  font-size:15px;
  margin-bottom:8px;
}

/* HP */

.bar{
  width:100%;
  height:12px;

  background:#1b1b1b;

  border-radius:20px;

  overflow:hidden;

  margin-top:5px;
}

#hpFill{
  width:100%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      #ff2020,
      #ff5555
    );

  box-shadow:
    0 0 10px red;

  transition:.15s;
}

/* SHIELD */

#shieldFill{
  width:65%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      #168cff,
      #55c8ff
    );

  box-shadow:
    0 0 10px #168cff;
}

/* STATS */

#stats{
  display:flex;
  gap:10px;

  margin-top:10px;
}

.stat{
  padding:8px 12px;

  background:rgba(255,255,255,.06);

  border-radius:9px;

  color:white;

  font-size:13px;
}

/* RIGHT HUD */

#rightHud{
  display:flex;
  gap:10px;
}

.currency{
  padding:10px 15px;

  background:rgba(0,0,0,.7);

  border:1px solid rgba(255,255,255,.15);

  border-radius:10px;

  color:white;

  font-weight:bold;

  backdrop-filter:blur(8px);
}

/* CROSSHAIR */

#crosshair{
  position:absolute;

  left:50%;
  top:50%;

  width:34px;
  height:34px;

  transform:translate(-50%,-50%);

  pointer-events:none;
}

#crosshair::before,
#crosshair::after{
  content:"";

  position:absolute;

  background:#ff3333;

  box-shadow:0 0 8px red;
}

#crosshair::before{
  width:34px;
  height:2px;

  top:16px;
  left:0;
}

#crosshair::after{
  width:2px;
  height:34px;

  left:16px;
  top:0;
}

/* HIT MARKER */

#hit{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  color:white;

  font-size:28px;

  opacity:0;

  pointer-events:none;
}

/* SKILLS */

#skills{
  position:absolute;

  bottom:20px;
  left:50%;

  transform:translateX(-50%);

  display:flex;

  gap:12px;
}

.skill{
  width:65px;
  height:65px;

  border-radius:15px;

  border:1px solid rgba(255,255,255,.2);

  background:
    linear-gradient(
      145deg,
      rgba(50,50,50,.9),
      rgba(5,5,5,.95)
    );

  color:white;

  font-size:26px;

  cursor:pointer;

  box-shadow:
    0 0 15px rgba(255,0,0,.15);

  transition:.2s;

  position:relative;
}

.skill:hover{
  transform:translateY(-6px);

  box-shadow:
    0 0 20px rgba(255,0,0,.6);
}

.skill span{
  position:absolute;

  bottom:4px;
  left:0;
  right:0;

  font-size:9px;

  color:#aaa;
}

/* SKILL NUMBER */

.key{
  position:absolute;

  top:4px;
  left:7px;

  font-size:10px;

  color:#ff4444;
}

/* STATUS */

#status{
  position:absolute;

  top:105px;
  left:50%;

  transform:translateX(-50%);

  padding:9px 18px;

  background:rgba(0,0,0,.6);

  border:1px solid rgba(255,255,255,.1);

  border-radius:20px;

  color:#ddd;

  font-size:13px;

  opacity:0;

  transition:.3s;
}

/* GAME OVER */

#over{
  display:none;

  position:absolute;

  inset:0;

  background:
    radial-gradient(
      circle,
      rgba(100,0,0,.35),
      rgba(0,0,0,.94)
    );

  justify-content:center;
  align-items:center;

  text-align:center;
}

.overBox{
  width:340px;

  padding:30px;

  background:rgba(5,5,5,.9);

  border:1px solid rgba(255,0,0,.5);

  border-radius:20px;

  box-shadow:
    0 0 40px rgba(255,0,0,.35);
}

.overBox h1{
  color:#ff2222;

  font-size:38px;

  letter-spacing:4px;

  margin:0 0 15px;
}

.overBox p{
  color:#aaa;
}

.restart{
  margin-top:15px;

  padding:13px 35px;

  border:0;

  border-radius:10px;

  background:#c40000;

  color:white;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;
}

/* MOBILE */

@media(max-width:700px){

  #playerBox{
    width:200px;
  }

  #rightHud{
    display:none;
  }

  .skill{
    width:58px;
    height:58px;
  }

  #skills{
    gap:7px;
    bottom:12px;
  }

}

</style>

</head>

<body>

<canvas id="game"></canvas>


<!-- TOP HUD -->

<div id="topHud">

  <div id="playerBox">

    <div id="playerName">
      🔴 RISHI • LEVEL 01
    </div>

    <div>
      ❤️ HP
    </div>

    <div class="bar">
      <div id="hpFill"></div>
    </div>

    <div>
      🛡 SHIELD
    </div>

    <div class="bar">
      <div id="shieldFill"></div>
    </div>

    <div id="stats">

      <div class="stat">
        🎯 KILLS: <span id="kills">0</span>
      </div>

      <div class="stat">
        ⭐ SCORE: <span id="score">0</span>
      </div>

    </div>

  </div>


  <div id="rightHud">

    <div class="currency">
      🪙 <span id="coins">100</span>
    </div>

    <div class="currency">
      💎 10
    </div>

  </div>

</div>


<!-- STATUS -->

<div id="status">
  WARZONE ACTIVE
</div>


<!-- CROSSHAIR -->

<div id="crosshair"></div>

<div id="hit">
  ✦
</div>


<!-- SKILLS -->

<div id="skills">

  <button class="skill" onclick="blast()">
    <div class="key">1</div>
    🔥
    <span>BLAST</span>
  </button>

  <button class="skill" onclick="shield()">
    <div class="key">2</div>
    🛡
    <span>SHIELD</span>
  </button>

  <button class="skill" onclick="speed()">
    <div class="key">3</div>
    ⚡
    <span>SPEED</span>
  </button>

  <button class="skill" onclick="rage()">
    <div class="key">4</div>
    💀
    <span>RAGE</span>
  </button>

</div>


<!-- GAME OVER -->

<div id="over">

  <div class="overBox">

    <h1>GAME OVER</h1>

    <p>
      The Warzone has defeated you.
    </p>

    <p>
      Kills:
      <b id="finalKills">0</b>
    </p>

    <p>
      Score:
      <b id="finalScore">0</b>
    </p>

    <button
      class="restart"
      onclick="location.reload()">

      🔄 RESTART

    </button>

  </div>

</div>


<script>

/* CANVAS */

const c =
  document.getElementById("game");

const ctx =
  c.getContext("2d");


function resize(){

  c.width =
    window.innerWidth;

  c.height =
    window.innerHeight;

}

resize();

window.addEventListener(
  "resize",
  resize
);


/* PLAYER */

let player = {

  x:c.width/2,

  y:c.height-150,

  size:42,

  speed:7

};


/* GAME DATA */

let bullets=[];
let enemies=[];
let explosions=[];
let particles=[];

let hp=2000;
let maxHp=2000;

let shieldValue=1200;
let maxShield=1200;

let coins=100;

let kills=0;
let score=0;

let keys={};

let mouseX=
  c.width/2;

let mouseY=
  c.height/2;

let speedBoost=false;
let shieldOn=false;
let rageOn=false;
let hitFlash=0;
const bulletDamage = 25;
const enemyMaxHp = 250;


/* KEYBOARD */

window.addEventListener(
  "keydown",
  function(e){

    keys[e.key.toLowerCase()]=true;

    if(e.key==="1") blast();
    if(e.key==="2") shield();
    if(e.key==="3") speed();
    if(e.key==="4") rage();

  }
);

window.addEventListener(
  "keyup",
  function(e){

    keys[e.key.toLowerCase()]=false;

  }
);


/* MOUSE */

window.addEventListener(
  "mousemove",
  function(e){

    mouseX=e.clientX;
    mouseY=e.clientY;

    player.x =
      mouseX-20;

  }
);


/* SHOOT */

setInterval(
  function(){

    bullets.push({

      x:player.x+18,

      y:player.y,

      speed:10

    });

  },
  250
);


/* ENEMIES */

setInterval(
  function(){

    enemies.push({

      x:Math.random()*
        (c.width-40),

      y:-40,

      size:35,

      hp:100,

      maxHp:100,

      speed:
        2+
        Math.random()*2

    });

  },
  750
);


/* PLAYER MOVEMENT */

function movePlayer(){

  if(
    keys["a"] ||
    keys["arrowleft"]
  ){

    player.x-=
      speedBoost ?
      player.speed*1.7 :
      player.speed;

  }

  if(
    keys["d"] ||
    keys["arrowright"]
  ){

    player.x+=
      speedBoost ?
      player.speed*1.7 :
      player.speed;

  }

  player.x=
    Math.max(
      0,
      Math.min(
        c.width-player.size,
        player.x
      )
    );

}


/* BACKGROUND */

function drawBackground(){

  ctx.fillStyle="#050505";

  ctx.fillRect(
    0,
    0,
    c.width,
    c.height
  );


  /* RED GRID */

  ctx.strokeStyle=
    "rgba(255,0,0,.08)";

  ctx.lineWidth=1;

  let gridSize=70;

  for(
    let x=0;
    x<c.width;
    x+=gridSize
  ){

    ctx.beginPath();

    ctx.moveTo(x,0);

    ctx.lineTo(x,c.height);

    ctx.stroke();

  }

  for(
    let y=0;
    y<c.height;
    y+=gridSize
  ){

    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(c.width,y);

    ctx.stroke();

  }


  /* VIGNETTE */

  let gradient=
    ctx.createRadialGradient(
      c.width/2,
      c.height/2,
      100,
      c.width/2,
      c.height/2,
      c.width
    );

  gradient.addColorStop(
    0,
    "rgba(255,0,0,.03)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,.8)"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,
    0,
    c.width,
    c.height
  );

}


/* PLAYER */

function drawPlayer(){

  ctx.save();

  ctx.shadowBlur=25;

  ctx.shadowColor=
    speedBoost ?
    "#00ffff" :
    "#ff2222";

  ctx.fillStyle=
    speedBoost ?
    "#00ffff" :
    "#ff2222";

  ctx.beginPath();

  ctx.arc(
    player.x+20,
    player.y+20,
    20,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* INNER CORE */

  ctx.shadowBlur=5;

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    player.x+20,
    player.y+20,
    9,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}


/* BULLETS */

function updateBullets(){

  bullets.forEach(
    function(b,i){

      b.y-=b.speed;

      ctx.fillStyle="#ffe600";

      ctx.shadowBlur=12;

      ctx.shadowColor="#ffe600";

      ctx.fillRect(
        b.x,
        b.y,
        5,
        16
      );

      ctx.shadowBlur=0;


      if(b.y<0){

        bullets.splice(i,1);

      }

    }
  );

}


/* ENEMIES */

function updateEnemies(){

  enemies.forEach(
    function(e,i){

      e.y+=e.speed;

      ctx.save();

      ctx.shadowBlur=18;

      ctx.shadowColor=
        "#ff0000";

      ctx.fillStyle=
        "#b00000";

      ctx.beginPath();

      ctx.arc(
        e.x+18,
        e.y+18,
        e.size/2,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.fillStyle="#ff5555";

      ctx.beginPath();

      ctx.arc(
        e.x+18,
        e.y+18,
        7,
        0,
        Math.PI*2
      );

      ctx.fill();

      /* ENEMY HP BAR */
      const hpRatio = Math.max(0, e.hp / e.maxHp);

      ctx.fillStyle = "#220000";
      ctx.fillRect(e.x, e.y - 10, 36, 5);

      ctx.fillStyle = hpRatio > 0.5 ? "#00ff66" : hpRatio > 0.25 ? "#ffd000" : "#ff3333";
      ctx.fillRect(e.x, e.y - 10, 36 * hpRatio, 5);

      ctx.restore();


      /* PLAYER HIT */

      if(
        Math.abs(
          player.x-e.x
        )<35 &&
        Math.abs(
          player.y-e.y
        )<35
      ){

        if(!shieldOn){

          hp-=60;

        }else{

          shieldValue-=60;

        }

        enemies.splice(i,1);

      }


      /* BULLET HIT */

      bullets.forEach(
        function(b,bi){

          if(
            Math.abs(
              b.x-e.x
            )<30 &&
            Math.abs(
              b.y-e.y
            )<30
          ){

            e.hp -= bulletDamage;

            bullets.splice(bi,1);

            if(e.hp <= 0){

              enemies.splice(i,1);

              kills++;

              score+=
                rageOn ?
                200 :
                100;

              coins+=
                rageOn ?
                20 :
                10;

              explosions.push({

                x:e.x+18,

                y:e.y+18,

                size:5

              });

            }

          }

        }
      );


      if(e.y>c.height+50){

        enemies.splice(i,1);

      }

    }
  );

}


/* EXPLOSIONS */

function updateExplosions(){

  explosions.forEach(
    function(ex,i){

      ex.size+=4;

      ctx.beginPath();

      ctx.arc(
        ex.x,
        ex.y,
        ex.size,
        0,
        Math.PI*2
      );

      ctx.strokeStyle=
        "#ff6a00";

      ctx.lineWidth=3;

      ctx.shadowBlur=20;

      ctx.shadowColor=
        "#ff3300";

      ctx.stroke();

      ctx.shadowBlur=0;


      if(ex.size>55){

        explosions.splice(i,1);

      }

    }
  );

}


/* SKILL STATUS */

function showStatus(text){

  const s=
    document.getElementById(
      "status"
    );

  s.innerText=text;

  s.style.opacity=1;

  setTimeout(
    function(){

      s.style.opacity=0;

    },
    1200
  );

}


/* BLAST */

function blast(){

  if(enemies.length===0)
    return;

  enemies.forEach(
    function(e){

      explosions.push({

        x:e.x+18,

        y:e.y+18,

        size:5

      });

    }
  );

  enemies=[];

  score+=500;

  showStatus(
    "🔥 BLAST ACTIVATED!"
  );

}


/* SHIELD */

function shield(){

  shieldOn=true;

  showStatus(
    "🛡 SHIELD ACTIVE!"
  );

  setTimeout(
    function(){

      shieldOn=false;

    },
    5000
  );

}


/* SPEED */

function speed(){

  speedBoost=true;

  showStatus(
    "⚡ SPEED BOOST!"
  );

  setTimeout(
    function(){

      speedBoost=false;

    },
    5000
  );

}


/* RAGE */

function rage(){

  rageOn=true;

  showStatus(
    "💀 RAGE MODE!"
  );

  setTimeout(
    function(){

      rageOn=false;

    },
    5000
  );

}


/* HUD */

function updateHUD(){

  document.getElementById(
    "hpFill"
  ).style.width=
    Math.max(
      0,
      hp/maxHp*100
    )+"%";


  document.getElementById(
    "shieldFill"
  ).style.width=
    Math.max(
      0,
      shieldValue/maxShield*100
    )+"%";


  document.getElementById(
    "coins"
  ).innerText=
    coins;


  document.getElementById(
    "kills"
  ).innerText=
    kills;


  document.getElementById(
    "score"
  ).innerText=
    score;

}


/* GAME LOOP */

function update(){

  drawBackground();

  movePlayer();

  drawPlayer();

  updateBullets();

  updateEnemies();

  updateExplosions();

  updateHUD();


  if(hp<=0){

    document.getElementById(
      "finalKills"
    ).innerText=
      kills;

    document.getElementById(
      "finalScore"
    ).innerText=
      score;

    document.getElementById(
      "over"
    ).style.display=
      "flex";

    return;

  }


  requestAnimationFrame(update);

}


showStatus(
  "⚔ WARZONE ACTIVE"
);

update();

</script>

</body>

</html>
