<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RM WARZONE — Matchmaking</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  width:100%;
  height:100vh;
  overflow:hidden;

  font-family:Arial,sans-serif;
  color:white;

  background:
    linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.9)),
    url("bg.jpg") center/cover no-repeat;
}

/* MAIN */

.container{
  width:100%;
  height:100vh;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;
}

/* LOGO */

.logo{
  width:210px;

  filter:
    drop-shadow(0 0 10px red)
    drop-shadow(0 0 30px darkred);

  margin-bottom:20px;
}

/* TITLE */

.title{
  font-size:30px;
  font-weight:bold;

  letter-spacing:4px;

  text-shadow:
    0 0 10px red,
    0 0 25px darkred;
}

.loading{
  margin-top:10px;

  color:#bbb;
  font-size:17px;
}

/* LOADING DOTS */

.dots{
  display:inline-block;
  width:25px;
  text-align:left;
}

/* TEAM */

.team{
  margin-top:25px;

  width:320px;
  padding:18px;

  background:rgba(0,0,0,.65);

  border:1px solid rgba(255,255,255,.15);
  border-radius:15px;

  box-shadow:
    0 0 25px rgba(255,0,0,.25);

  backdrop-filter:blur(10px);
}

.team-title{
  font-size:18px;
  font-weight:bold;

  margin-bottom:12px;

  color:#ff3333;
}

.player{
  display:flex;

  justify-content:space-between;
  align-items:center;

  padding:9px 10px;

  margin:6px 0;

  background:rgba(255,255,255,.06);

  border-radius:8px;
}

.online{
  color:#55ff55;
  font-size:12px;
}

/* COUNTDOWN */

#countdown{
  margin-top:20px;

  font-size:55px;
  font-weight:bold;

  color:#ff3333;

  text-shadow:
    0 0 15px red,
    0 0 35px red;
}

/* HIDE */

.hidden{
  display:none;
}

/* FOOTER */

.footer{
  position:absolute;

  bottom:18px;

  left:25px;
  right:25px;

  display:flex;
  justify-content:space-between;

  color:#777;

  font-size:12px;
}

</style>

</head>

<body>

<div class="container">

  <img class="logo" src="logo.png">

  <div class="title">
    FINDING PLAYERS
  </div>

  <div class="loading">
    Connecting to RM Warzone server<span class="dots" id="dots">.</span>
  </div>

  <div class="team hidden" id="team">

    <div class="team-title">
      ⚔ SQUAD — 6 PLAYERS
    </div>

    <div class="player">
      <span>👤 RISHI</span>
      <span class="online">● READY</span>
    </div>

    <div class="player">
      <span>🎯 Player45</span>
      <span class="online">● READY</span>
    </div>

    <div class="player">
      <span>🔫 SniperX</span>
      <span class="online">● READY</span>
    </div>

    <div class="player">
      <span>👤 Ghost</span>
      <span class="online">● READY</span>
    </div>

    <div class="player">
      <span>⚔ Warrior</span>
      <span class="online">● READY</span>
    </div>

    <div class="player">
      <span>💀 Shadow</span>
      <span class="online">● READY</span>
    </div>

  </div>

  <div id="countdown" class="hidden">
    3
  </div>

</div>

<div class="footer">

  <span>RM WARZONE</span>

  <span>SERVER: ONLINE</span>

</div>


<script>

/* LOADING DOTS */

let dotCount = 1;

setInterval(function(){

  dotCount++;

  if(dotCount > 3){
    dotCount = 1;
  }

  document.getElementById("dots").innerText =
    ".".repeat(dotCount);

},500);


/* MATCHMAKING */

setTimeout(function(){

  document.querySelector(".title").innerText =
    "PLAYERS FOUND";

  document.querySelector(".loading").innerText =
    "Squad assembled • All players ready";

  document.getElementById("team")
    .classList.remove("hidden");

},2000);


/* COUNTDOWN */

setTimeout(function(){

  document.querySelector(".title").innerText =
    "MATCH STARTING";

  document.querySelector(".loading").innerText =
    "Entering the Warzone...";

  document.getElementById("countdown")
    .classList.remove("hidden");

  let number = 3;

  document.getElementById("countdown").innerText =
    number;

  let timer = setInterval(function(){

    number--;

    if(number > 0){

      document.getElementById("countdown").innerText =
        number;

    }else{

      clearInterval(timer);

      document.getElementById("countdown").innerText =
        "⚔";

      setTimeout(function(){

        window.location.href =
          "rm-warzone.html";

      },700);

    }

  },1000);

},5000);

</script>

</body>
</html>
