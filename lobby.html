<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RM WARZONE — Lobby</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  width:100%;
  height:100vh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
  background:#050505 url("bg.jpg") center/cover no-repeat;
}

.overlay{
  position:fixed;
  inset:0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.35),rgba(0,0,0,.8)),
    linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.75));
  z-index:0;
}

/* PARTICLES */

.particle{
  position:absolute;
  width:3px;
  height:3px;
  background:red;
  border-radius:50%;
  box-shadow:0 0 10px red;
  animation:float 6s linear infinite;
  opacity:.7;
}

@keyframes float{
  0%{
    transform:translateY(100vh);
    opacity:0;
  }

  20%{
    opacity:1;
  }

  100%{
    transform:translateY(-10vh);
    opacity:0;
  }
}

/* MAIN */

.main{
  position:relative;
  z-index:2;
  width:100%;
  height:100vh;
}

/* TOP BAR */

.topbar{
  position:absolute;
  top:18px;
  left:25px;
  right:25px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  width:170px;

  filter:
    drop-shadow(0 0 8px red)
    drop-shadow(0 0 20px darkred);
}

/* PROFILE */

.profile{
  display:flex;
  align-items:center;
  gap:12px;

  padding:10px 18px;

  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.15);
  border-radius:15px;

  backdrop-filter:blur(10px);
}

.avatar{
  width:45px;
  height:45px;

  border-radius:50%;

  background:#111;
  border:2px solid red;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:22px;

  box-shadow:0 0 15px red;
}

.username{
  font-weight:bold;
  font-size:16px;
}

.status{
  font-size:11px;
  color:#54ff54;
}

/* CURRENCY */

.currency{
  position:absolute;
  top:90px;
  right:25px;

  display:flex;
  gap:10px;
}

.money{
  padding:9px 15px;

  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.15);

  border-radius:12px;

  backdrop-filter:blur(10px);

  font-weight:bold;
}

/* SIDE MENU */

.side-menu{
  position:absolute;

  top:50%;
  left:25px;

  transform:translateY(-50%);

  display:flex;
  flex-direction:column;
  gap:12px;
}

.menu-btn{
  width:150px;
  padding:13px;

  border:none;
  border-left:4px solid red;
  border-radius:8px;

  color:white;
  background:rgba(0,0,0,.65);

  text-align:left;
  font-weight:bold;

  cursor:pointer;

  transition:.25s;

  backdrop-filter:blur(8px);
}

.menu-btn:hover{
  transform:translateX(8px);

  background:rgba(150,0,0,.6);

  box-shadow:0 0 18px rgba(255,0,0,.4);
}

/* CENTER */

.center{
  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  text-align:center;
}

/* 3D SCENE AREA */

#threeDScene{
  width:360px;
  height:300px;

  margin:auto;

  position:relative;

  display:flex;
  justify-content:center;
  align-items:center;
}

/* TEMPORARY 3D STYLE */

.warzone-core{
  width:180px;
  height:180px;

  border-radius:50%;

  background:
    radial-gradient(circle,#ff4444,#650000 55%,#050505 75%);

  box-shadow:
    0 0 25px red,
    0 0 60px rgba(255,0,0,.6),
    inset 0 0 35px #000;

  animation:coreFloat 3s ease-in-out infinite;
}

@keyframes coreFloat{

  0%,100%{
    transform:translateY(0) rotate(0deg);
  }

  50%{
    transform:translateY(-12px) rotate(180deg);
  }

}

/* READY */

.ready{
  margin-top:5px;

  font-size:28px;
  font-weight:bold;

  letter-spacing:4px;

  text-shadow:
    0 0 10px red,
    0 0 25px darkred;
}

.subtitle{
  margin-top:6px;

  color:#bbb;

  letter-spacing:2px;
}

/* PLAY BUTTON */

.play{
  margin-top:25px;

  width:240px;

  padding:17px;

  border:none;
  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      #8b0000,
      #ff1a1a,
      #8b0000
    );

  color:white;

  font-size:22px;
  font-weight:bold;

  letter-spacing:3px;

  cursor:pointer;

  box-shadow:
    0 0 15px red,
    0 0 35px rgba(255,0,0,.45);

  animation:pulse 2s infinite;

  transition:.25s;
}

.play:hover{
  transform:scale(1.06);

  box-shadow:
    0 0 25px red,
    0 0 55px rgba(255,0,0,.7);
}

@keyframes pulse{

  0%,100%{
    box-shadow:0 0 15px red;
  }

  50%{
    box-shadow:
      0 0 35px red,
      0 0 60px rgba(255,0,0,.5);
  }

}

/* BOTTOM */

.bottom{
  position:absolute;

  bottom:18px;
  left:25px;
  right:25px;

  display:flex;
  justify-content:space-between;

  color:#aaa;

  font-size:12px;
}

/* MOBILE */

@media(max-width:700px){

  .logo{
    width:130px;
  }

  .profile{
    padding:7px 10px;
  }

  .side-menu{
    left:10px;
  }

  .menu-btn{
    width:115px;
    padding:10px;
    font-size:12px;
  }

  #threeDScene{
    width:260px;
    height:240px;
  }

  .warzone-core{
    width:140px;
    height:140px;
  }

  .ready{
    font-size:20px;
  }

  .play{
    width:200px;
  }

  .currency{
    right:10px;
    top:75px;
  }

}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div class="overlay"></div>

<!-- PARTICLES -->

<div class="particle" style="left:5%;animation-delay:0s;"></div>
<div class="particle" style="left:15%;animation-delay:2s;"></div>
<div class="particle" style="left:25%;animation-delay:4s;"></div>
<div class="particle" style="left:38%;animation-delay:1s;"></div>
<div class="particle" style="left:52%;animation-delay:3s;"></div>
<div class="particle" style="left:65%;animation-delay:5s;"></div>
<div class="particle" style="left:78%;animation-delay:2s;"></div>
<div class="particle" style="left:90%;animation-delay:4s;"></div>


<div class="main">

  <!-- TOP -->

  <div class="topbar">

    <img class="logo" src="logo.png">

    <div class="profile">

      <div class="avatar">
        👤
      </div>

      <div>

        <div class="username">
          RISHI
        </div>

        <div class="status">
          ● ONLINE
        </div>

      </div>

    </div>

  </div>


  <!-- CURRENCY -->

  <div class="currency">

    <div class="money">
      🪙 1000
    </div>

    <div class="money">
      💎 10
    </div>

  </div>


  <!-- SIDE MENU -->

  <div class="side-menu">

    <button class="menu-btn" onclick="menuClick('SHOP')">
      🛒 SHOP
    </button>

    <button class="menu-btn" onclick="menuClick('FRIENDS')">
      👥 FRIENDS
    </button>

    <button class="menu-btn" onclick="menuClick('SETTINGS')">
      ⚙ SETTINGS
    </button>

  </div>


  <!-- CENTER -->

  <div class="center">

    <div id="threeDScene">

      <div class="warzone-core"></div>

    </div>

    <div class="ready">
      READY FOR BATTLE
    </div>

    <div class="subtitle">
      ENTER THE WARZONE
    </div>

    <button class="play" onclick="startGame()">
      ⚔ PLAY NOW
    </button>

  </div>


  <!-- BOTTOM -->

  <div class="bottom">

    <div>
      RM WARZONE
    </div>

    <div>
      SEASON 01 • ONLINE
    </div>

  </div>

</div>


<!-- SOUND -->

<audio
  id="clickSound"
  src="https://www.soundjay.com/buttons/button-16.mp3">
</audio>


<script>

function playSound(){

  let sound=document.getElementById("clickSound");

  sound.currentTime=0;

  sound.play().catch(()=>{});

}


function startGame(){

  playSound();

  setTimeout(function(){

    window.location.href="dashboard.html";

  },300);

}


function menuClick(name){

  playSound();

  alert(name+" system coming soon ⚔️");

}

</script>
<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  360 / 300,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({
  alpha:true,
  antialias:true
});

renderer.setSize(360,300);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

document.getElementById("threeDScene").appendChild(
  renderer.domElement
);


/* REMOVE TEMPORARY CORE */

const oldCore = document.querySelector(".warzone-core");

if(oldCore){
  oldCore.remove();
}


/* LIGHT */

const light = new THREE.PointLight(
  0xff2222,
  3,
  100
);

light.position.set(2,3,4);

scene.add(light);


/* SECOND LIGHT */

const blueLight = new THREE.PointLight(
  0x2244ff,
  2,
  100
);

blueLight.position.set(-3,-2,3);

scene.add(blueLight);


/* MAIN WARZONE SPHERE */

const sphereGeometry =
  new THREE.IcosahedronGeometry(1.45,2);

const sphereMaterial =
  new THREE.MeshStandardMaterial({
    color:0x550000,
    emissive:0x220000,
    metalness:0.8,
    roughness:0.25
  });

const sphere =
  new THREE.Mesh(
    sphereGeometry,
    sphereMaterial
  );

scene.add(sphere);


/* OUTER RING */

const ringGeometry =
  new THREE.TorusGeometry(
    2,
    0.035,
    16,
    100
  );

const ringMaterial =
  new THREE.MeshBasicMaterial({
    color:0xff2222
  });

const ring =
  new THREE.Mesh(
    ringGeometry,
    ringMaterial
  );

ring.rotation.x =
  Math.PI / 2;

scene.add(ring);


/* SECOND RING */

const ring2 =
  new THREE.Mesh(
    new THREE.TorusGeometry(
      2.25,
      0.025,
      16,
      100
    ),
    new THREE.MeshBasicMaterial({
      color:0x2266ff
    })
  );

ring2.rotation.y =
  Math.PI / 3;

scene.add(ring2);


/* SMALL ENERGY BALLS */

const ballGeometry =
  new THREE.SphereGeometry(
    0.08,
    12,
    12
  );

const ballMaterial =
  new THREE.MeshBasicMaterial({
    color:0xff3333
  });

const balls=[];

for(let i=0;i<18;i++){

  const ball =
    new THREE.Mesh(
      ballGeometry,
      ballMaterial
    );

  const angle =
    (i/18)*Math.PI*2;

  ball.position.x =
    Math.cos(angle)*2.7;

  ball.position.y =
    Math.sin(angle)*2.7;

  ball.position.z =
    (Math.random()-0.5)*1.5;

  scene.add(ball);

  balls.push(ball);
}


/* CAMERA */

camera.position.z = 6;
/* WARZONE GROUND */

const groundGeometry =
  new THREE.PlaneGeometry(20,20);

const groundMaterial =
  new THREE.MeshStandardMaterial({
    color:0x080808,
    metalness:0.5,
    roughness:0.8
  });

const ground =
  new THREE.Mesh(
    groundGeometry,
    groundMaterial
  );

ground.rotation.x =
  -Math.PI / 2;

ground.position.y =
  -1.8;

scene.add(ground);


/* WARZONE GRID */

const grid =
  new THREE.GridHelper(
    20,
    20,
    0xff2222,
    0x222222
  );

grid.position.y =
  -1.78;

scene.add(grid);


/* FOG */

scene.fog =
  new THREE.FogExp2(
    0x050505,
    0.08
  );

/* ANIMATION */

function animate(){

  requestAnimationFrame(animate);

  sphere.rotation.x += 0.004;
  sphere.rotation.y += 0.008;

  ring.rotation.z += 0.012;

  ring2.rotation.x += 0.008;
  ring2.rotation.z -= 0.006;

  balls.forEach((ball,index)=>{

    const angle =
      Date.now()*0.001 +
      index;

    ball.position.y =
      Math.sin(angle)*2.5;

    ball.position.x =
      Math.cos(angle)*2.5;

  });

  renderer.render(
    scene,
    camera
  );

}

animate();


/* RESIZE */

window.addEventListener(
  "resize",
  function(){

    const width =
      document.getElementById(
        "threeDScene"
      ).clientWidth;

    const height =
      document.getElementById(
        "threeDScene"
      ).clientHeight;

    camera.aspect =
      width / height;

    camera.updateProjectionMatrix();

    renderer.setSize(
      width,
      height
    );

  }
);

</script>
</body>
</html>
