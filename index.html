<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RM WARZONE — Official</title>

<meta name="description"
content="RM WARZONE — Enter the battlefield. Fight, survive, level up and become a legend.">

<meta name="theme-color" content="#07080d">

<link rel="icon" href="logo.png">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#05060a;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font-family:inherit;
}

/* =========================
   GLOBAL
========================= */

:root{
    --red:#ff2438;
    --red2:#b90018;
    --dark:#05060a;
    --panel:#0b0e15;
    --panel2:#10141d;
    --text:#ffffff;
    --muted:#9da5b4;
    --line:rgba(255,255,255,.08);
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#05060a;
}

::-webkit-scrollbar-thumb{
    background:#8e1020;
    border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
    background:#ff2438;
}

/* =========================
   BACKGROUND
========================= */

.page-bg{
    position:fixed;
    inset:0;
    z-index:-10;
    background:
        linear-gradient(
            180deg,
            rgba(3,4,8,.48),
            rgba(3,4,8,.88)
        ),
        url("bg.jpg") center/cover no-repeat;
    filter:saturate(1.05);
}

.page-bg::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,25,50,.12),
            transparent 35%
        ),
        linear-gradient(
            90deg,
            rgba(0,0,0,.7),
            transparent 45%,
            rgba(0,0,0,.7)
        );
}

/* =========================
   PARTICLES
========================= */

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-5;
    overflow:hidden;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    background:#ff3348;
    border-radius:50%;
    opacity:.45;
    animation:floatParticle linear infinite;
}

@keyframes floatParticle{
    from{
        transform:translateY(110vh);
        opacity:0;
    }
    15%{
        opacity:.5;
    }
    85%{
        opacity:.35;
    }
    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}

/* =========================
   HEADER
========================= */

header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:78px;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5%;

    background:
        linear-gradient(
            180deg,
            rgba(3,4,8,.96),
            rgba(3,4,8,.7)
        );

    border-bottom:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(14px);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
}

.brand img{
    width:48px;
    height:48px;
    object-fit:contain;
    filter:
        drop-shadow(0 0 10px rgba(255,20,45,.45));
}

.brand-text{
    font-size:18px;
    font-weight:900;
    letter-spacing:2px;
}

.brand-text span{
    color:var(--red);
}

nav{
    display:flex;
    align-items:center;
    gap:26px;
}

nav a{
    font-size:12px;
    font-weight:700;
    letter-spacing:1.2px;
    color:#cdd2dc;
    transition:.25s;
}

nav a:hover{
    color:#fff;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:9px;
}

.header-btn{
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.04);
    color:#fff;
    padding:11px 16px;
    border-radius:7px;
    font-size:11px;
    font-weight:800;
    letter-spacing:.8px;
    cursor:pointer;
    transition:.25s;
}

.header-btn:hover{
    border-color:rgba(255,36,56,.6);
    background:rgba(255,36,56,.1);
}

.header-btn.primary{
    background:var(--red);
    border-color:var(--red);
}

.header-btn.primary:hover{
    background:#ff4051;
    box-shadow:0 0 25px rgba(255,36,56,.25);
}

.menu-btn{
    display:none;
    border:1px solid var(--line);
    background:rgba(255,255,255,.05);
    color:#fff;
    width:42px;
    height:42px;
    border-radius:7px;
    cursor:pointer;
    font-size:20px;
}

/* =========================
   MOBILE NAV
========================= */

.mobile-menu{
    position:fixed;
    top:78px;
    left:0;
    right:0;
    z-index:999;

    background:rgba(5,6,10,.98);
    border-bottom:1px solid var(--line);

    display:none;
    padding:20px 6%;
}

.mobile-menu.active{
    display:block;
}

.mobile-menu a{
    display:block;
    padding:15px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
    font-size:13px;
    color:#dce0e8;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    padding:
        150px 7% 90px;

    display:flex;
    align-items:center;

    position:relative;
}

.hero-content{
    width:min(850px,100%);
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:9px;

    padding:9px 14px;

    border:1px solid rgba(255,36,56,.32);
    background:rgba(255,36,56,.07);
    border-radius:5px;

    font-size:10px;
    letter-spacing:2px;
    font-weight:800;
    color:#ff6b79;

    margin-bottom:24px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#36ff79;
    box-shadow:0 0 12px #36ff79;
}

.hero-title{
    font-size:clamp(58px,10vw,132px);
    line-height:.85;
    font-weight:1000;
    letter-spacing:-5px;

    text-transform:uppercase;

    text-shadow:
        0 0 30px rgba(255,0,30,.16);
}

.hero-title span{
    color:var(--red);
    display:block;
}

.hero-subtitle{
    margin-top:30px;
    max-width:680px;

    color:#c3c8d2;
    font-size:18px;
    line-height:1.8;
}

.hero-description{
    margin-top:16px;
    max-width:700px;

    color:#7f8796;
    font-size:14px;
    line-height:1.8;
}

.hero-actions{
    display:flex;
    gap:12px;
    margin-top:35px;
    flex-wrap:wrap;
}

.big-btn{
    border:none;
    cursor:pointer;

    min-width:180px;
    padding:17px 28px;

    border-radius:7px;

    font-size:12px;
    font-weight:900;
    letter-spacing:1.2px;

    transition:.25s;
}

.big-btn.red{
    background:var(--red);
    color:#fff;

    box-shadow:
        0 12px 35px rgba(255,36,56,.2);
}

.big-btn.red:hover{
    transform:translateY(-2px);
    background:#ff3c50;
    box-shadow:
        0 15px 45px rgba(255,36,56,.32);
}

.big-btn.dark{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.13);
    color:#fff;
}

.big-btn.dark:hover{
    background:rgba(255,255,255,.1);
}

.hero-meta{
    display:flex;
    gap:28px;
    margin-top:48px;
    flex-wrap:wrap;
}

.hero-meta-item{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.hero-meta-item strong{
    font-size:13px;
    letter-spacing:1px;
}

.hero-meta-item span{
    color:#747d8d;
    font-size:10px;
    letter-spacing:1.3px;
}

/* =========================
   SECTION
========================= */

section{
    padding:100px 7%;
    position:relative;
}

.section-label{
    color:var(--red);
    font-size:10px;
    letter-spacing:3px;
    font-weight:900;
    margin-bottom:12px;
}

.section-title{
    font-size:clamp(32px,5vw,58px);
    font-weight:950;
    letter-spacing:-1.5px;
}

.section-subtitle{
    color:#858d9b;
    max-width:720px;
    line-height:1.8;
    font-size:14px;
    margin-top:16px;
}

/* =========================
   ABOUT
========================= */

.about{
    background:
        linear-gradient(
            180deg,
            rgba(5,6,10,.92),
            rgba(8,10,15,.97)
        );
}

.about-grid{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:70px;
    margin-top:55px;
}

.about-text p{
    color:#9ca4b2;
    line-height:1.95;
    font-size:15px;
    margin-bottom:20px;
}

.about-highlight{
    padding:30px;
    background:linear-gradient(
        145deg,
        rgba(255,36,56,.1),
        rgba(255,255,255,.025)
    );

    border:1px solid rgba(255,36,56,.15);
    border-radius:12px;
}

.about-highlight h3{
    font-size:20px;
    margin-bottom:15px;
}

.about-highlight p{
    color:#8e96a5;
    font-size:13px;
    line-height:1.8;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    margin-top:60px;

    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.07);
}

.stat{
    background:#080a10;
    padding:30px 25px;
}

.stat strong{
    display:block;
    font-size:34px;
    font-weight:950;
}

.stat span{
    display:block;
    margin-top:7px;
    color:#737c8b;
    font-size:10px;
    letter-spacing:1.5px;
}

/* =========================
   FEATURES
========================= */

.features{
    background:#070910;
}

.feature-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:55px;
}

.feature-card{
    min-height:230px;

    padding:28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );

    border:1px solid rgba(255,255,255,.07);
    border-radius:10px;

    transition:.3s;
}

.feature-card:hover{
    transform:translateY(-5px);
    border-color:rgba(255,36,56,.3);
    background:
        linear-gradient(
            145deg,
            rgba(255,36,56,.08),
            rgba(255,255,255,.015)
        );
}

.feature-icon{
    width:48px;
    height:48px;

    display:grid;
    place-items:center;

    border-radius:9px;

    background:rgba(255,36,56,.09);
    border:1px solid rgba(255,36,56,.15);

    font-size:21px;
}

.feature-card h3{
    margin-top:25px;
    font-size:17px;
}

.feature-card p{
    color:#7f8796;
    line-height:1.75;
    font-size:12px;
    margin-top:11px;
}

/* =========================
   WARZONE
========================= */

.warzone{
    min-height:600px;

    background:
        linear-gradient(
            90deg,
            rgba(4,5,8,.98),
            rgba(4,5,8,.65),
            rgba(4,5,8,.95)
        ),
        url("plane.png") center/cover no-repeat;
}

.warzone-content{
    max-width:700px;
}

.warzone-content p{
    color:#929aa8;
    line-height:1.9;
    margin-top:25px;
    font-size:14px;
}

/* =========================
   SYSTEM CARDS
========================= */

.system-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-top:55px;
}

.system-card{
    padding:32px;

    border:1px solid rgba(255,255,255,.07);
    background:#0a0d14;
    border-radius:10px;
}

.system-card h3{
    font-size:20px;
}

.system-card p{
    color:#7e8795;
    font-size:13px;
    line-height:1.8;
    margin-top:12px;
}

.system-list{
    margin-top:20px;
    display:grid;
    gap:9px;
}

.system-list div{
    color:#a9b0bd;
    font-size:12px;
    padding:10px 12px;
    border-left:2px solid var(--red);
    background:rgba(255,255,255,.025);
}

/* =========================
   SHOWCASE
========================= */

.showcase{
    background:#06070b;
}

.showcase-grid{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:20px;
    margin-top:55px;
}

.showcase-box{
    min-height:280px;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    border:1px solid rgba(255,255,255,.08);
}

.showcase-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:.5s;
}

.showcase-box:hover img{
    transform:scale(1.04);
}

.showcase-overlay{
    position:absolute;
    inset:0;

    display:flex;
    align-items:flex-end;

    padding:25px;

    background:
        linear-gradient(
            transparent 35%,
            rgba(0,0,0,.9)
        );
}

.showcase-overlay h3{
    font-size:20px;
}

/* =========================
   NEWS
========================= */

.news-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:55px;
}

.news-card{
    padding:25px;
    background:#0a0d14;
    border:1px solid rgba(255,255,255,.07);
    border-radius:10px;
}

.news-date{
    color:var(--red);
    font-size:9px;
    letter-spacing:2px;
    font-weight:900;
}

.news-card h3{
    margin-top:14px;
    font-size:17px;
}

.news-card p{
    color:#7f8794;
    font-size:12px;
    line-height:1.75;
    margin-top:10px;
}

/* =========================
   SPONSORS
========================= */

.sponsors{
    background:
        radial-gradient(
            circle at 50% 0,
            rgba(255,36,56,.08),
            transparent 40%
        ),
        #070910;
    text-align:center;
}

.sponsors .section-subtitle{
    margin-left:auto;
    margin-right:auto;
}

.sponsor-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:50px;
}

.sponsor{
    min-height:130px;
    display:grid;
    place-items:center;

    border:1px dashed rgba(255,255,255,.12);
    border-radius:10px;

    background:rgba(255,255,255,.015);
}

.sponsor span{
    color:#596171;
    font-size:11px;
    font-weight:800;
    letter-spacing:1.5px;
}

.sponsor small{
    display:block;
    margin-top:7px;
    color:#3f4652;
    font-size:9px;
}

/* =========================
   COMPANY
========================= */

.company{
    background:#05060a;
}

.company-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:50px;
}

.company-card{
    padding:30px;
    border:1px solid rgba(255,255,255,.07);
    background:#090b11;
    border-radius:10px;
}

.company-card span{
    display:block;
    color:#656e7d;
    font-size:9px;
    letter-spacing:2px;
    margin-bottom:10px;
}

.company-card strong{
    font-size:21px;
}

/* =========================
   FAQ
========================= */

.faq{
    background:#080a10;
}

.faq-container{
    max-width:900px;
    margin:50px auto 0;
}

.faq-item{
    border-bottom:1px solid rgba(255,255,255,.08);
}

.faq-question{
    width:100%;
    padding:22px 0;

    background:none;
    border:none;

    color:#fff;
    text-align:left;

    display:flex;
    justify-content:space-between;
    align-items:center;

    cursor:pointer;

    font-size:14px;
    font-weight:700;
}

.faq-question span{
    color:var(--red);
    font-size:20px;
}

.faq-answer{
    display:none;
    color:#808896;
    font-size:12px;
    line-height:1.8;
    padding:0 0 22px;
}

.faq-item.active .faq-answer{
    display:block;
}

/* =========================
   CTA
========================= */

.final-cta{
    padding:130px 7%;
    text-align:center;

    background:
        linear-gradient(
            180deg,
            #08090f,
            #0d080b
        );
}

.final-cta h2{
    font-size:clamp(38px,7vw,78px);
    font-weight:1000;
    letter-spacing:-3px;
}

.final-cta h2 span{
    color:var(--red);
}

.final-cta p{
    max-width:650px;
    margin:20px auto 0;
    color:#7f8794;
    line-height:1.8;
    font-size:14px;
}

/* =========================
   FOOTER
========================= */

footer{
    background:#030407;
    border-top:1px solid rgba(255,255,255,.07);
    padding:65px 7% 25px;
}

.footer-grid{
    display:grid;
    grid-template-columns:1.5fr repeat(3,1fr);
    gap:40px;
}

.footer-brand p{
    color:#626b79;
    font-size:12px;
    line-height:1.8;
    max-width:340px;
